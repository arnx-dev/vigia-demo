name: vigia pr
# never switch to pull_request_target: PR code runs here
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check changed code
        # pin a tag or SHA once released
        uses: arnx-dev/vigia@main
        with:
          command: pr
          range: origin/${{ github.base_ref }}..HEAD
          pr: ${{ github.event.number }}
